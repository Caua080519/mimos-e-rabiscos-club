<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Minha conta | Mimos e Rabiscos Club</title>
  <meta name="theme-color" content="#dceffb">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/lapis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="account">
<header class="header">
  <div class="container header__in">
    <a class="logo" href="index.html" aria-label="Voltar para o início">
      <img src="assets/lapis.svg" alt="" width="26" height="38">
      <span>Mimos e Rabiscos <em>Club</em></span>
    </a>
    <a class="btn btn--ghost btn--small" href="conta.html">Área do cliente</a>
  </div>
</header>

<main class="container container--narrow prof">
  <header class="section__head">
    <p class="eyebrow">Configurações</p>
    <h1 class="h1-s">Minha conta</h1>
  </header>

  <section class="card prof__card" id="prof-card" hidden>
    <div class="prof__photo">
      <div class="prof__avatar" id="prof-avatar" aria-hidden="true"></div>
      <div class="prof__photo-btns">
        <label class="btn btn--small btn--ghost" for="prof-file">Escolher foto</label>
        <input id="prof-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="btn btn--small btn--ghost btn--danger" type="button" id="prof-remove" hidden>Remover foto</button>
      </div>
      <p class="acc-muted">JPG, PNG ou WEBP. A foto fica pequena e só aparece para você.</p>
    </div>

    <form class="form" id="prof-form" novalidate>
      <label>Como você quer ser chamado(a)? <input name="displayName" type="text" maxlength="40" autocomplete="nickname" placeholder="Seu apelido"></label>
      <label>Nome completo <input name="name" type="text" autocomplete="name" required></label>
      <label>E-mail <input name="email" type="email" disabled></label>
      <label>Telefone / WhatsApp <input name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
      <p class="error" id="prof-msg" role="alert" hidden></p>
      <button class="btn" type="submit">Salvar</button>
    </form>
  </section>

  <section class="card prof__card" id="pass-card" hidden>
    <h2 class="lead__title">Trocar senha</h2>
    <form class="form" id="pass-form" novalidate>
      <label>Nova senha <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="error" id="pass-msg" role="alert" hidden></p>
      <button class="btn btn--ghost" type="submit">Trocar senha</button>
    </form>
  </section>

  <section class="card prof__card" id="out-card" hidden>
    <button class="btn btn--ghost btn--danger" type="button" id="prof-out">Sair da conta</button>
  </section>
</main>

<footer class="footer">
  <div class="container"><small>© <span id="year"></span> Mimos e Rabiscos. Todos os direitos reservados.</small></div>
</footer>

<script src="js/data.js"></script>
<script src="js/mock/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="js/services/api.js"></script>
<script src="js/perfil.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
