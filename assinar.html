<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinar | Mimos e Rabiscos Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&family=Chewy&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/lapis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
  <div class="container header__in">
    <a class="logo" href="index.html" aria-label="Voltar para o início">
      <img src="assets/lapis.svg" alt="" width="26" height="38">
      <span>Mimos e Rabiscos <em>Club</em></span>
    </a>
    <a class="btn btn--ghost btn--small" href="index.html#boxes">Voltar</a>
  </div>
</header>

<main class="signup">
  <div class="container container--narrow">
    <header class="section__head">
      <p class="eyebrow">Assinatura mensal</p>
      <h1 class="h1-s">Escolha sua Box e assine</h1>
      <p class="sub">Pagamento por Pix ou cartão.</p>
    </header>

    <div class="card pay">
      <fieldset class="pay__plans" id="pay-plans">
        <legend>Sua Box</legend>
      </fieldset>

      <div class="pay__summary" id="pay-summary" aria-live="polite"></div>

      <div class="pay__methods" aria-label="Formas de pagamento">
        <span class="chip">Pix</span><span class="chip">Cartão</span>
      </div>

      <p class="pay__notice" id="pay-notice" hidden></p>
      <a class="btn btn--lg pay__go" id="pay-go" href="#" rel="noopener">Ir para o pagamento</a>
      <p class="pay__fine">Você será levada(o) a um ambiente de pagamento seguro para concluir a assinatura.</p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container"><small>© <span id="year"></span> Mimos e Rabiscos. Todos os direitos reservados.</small></div>
</footer>

<script src="js/data.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
