<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel dos donos | Mimos e Rabiscos Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/lapis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
<header class="header">
  <div class="container header__in">
    <a class="logo" id="logo" href="admin.html"><img src="assets/lapis.svg" alt="" width="26" height="38"><span>Painel <em>dos donos</em></span></a>
    <a class="btn btn--ghost btn--small" href="index.html">Voltar ao site</a>
  </div>
</header>

<main class="container adm">
  <div class="adm-warn" role="note">
    <strong>Modo protótipo.</strong> Os dados abaixo ficam só neste navegador e não há login ainda. Para usar de verdade com pedidos reais, falta ligar um banco de dados e uma senha. <span id="demo-note"></span>
  </div>

  <div class="adm-stats" id="stats"></div>

  <div class="adm-tabs" role="tablist">
    <button role="tab" class="is-on" data-tab="orders">Envios</button>
  </div>

  <section id="tab-orders">
    <div class="adm-filters">
      <label>Status
        <select id="f-status"><option value="">Todos</option></select>
      </label>
      <label>Box
        <select id="f-plan"><option value="">Todas</option></select>
      </label>
      <label>Buscar
        <input id="f-q" type="search" placeholder="Nome ou cidade">
      </label>
      <button class="btn btn--small btn--ghost" id="btn-demo" type="button">Carregar exemplos</button>
      <button class="btn btn--small btn--ghost" id="btn-clear" type="button">Limpar</button>
    </div>
    <div class="adm-list" id="orders"></div>
  </section>

</main>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
